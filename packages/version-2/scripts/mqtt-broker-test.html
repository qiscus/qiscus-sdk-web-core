<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Broker Round-Trip Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      background: #1a1a1a;
      color: #d4d4d4;
      padding: 24px;
      min-height: 100vh;
    }

    h1 {
      font-size: 18px;
      color: #f0f0f0;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .section {
      background: #242424;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-field.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 12px;
      color: #888;
    }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="url"] {
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 3px;
      color: #d4d4d4;
      font-family: inherit;
      font-size: 13px;
      padding: 5px 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #666; }

    .ws-note {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
      grid-column: 1 / -1;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
    }

    button {
      background: #2d6a2d;
      border: 1px solid #3a8a3a;
      border-radius: 3px;
      color: #d4f0d4;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 18px;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #3a7a3a; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    button.secondary {
      background: #2a2a2a;
      border-color: #444;
      color: #aaa;
    }

    button.secondary:hover:not(:disabled) { background: #333; }

    .verbose-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
      user-select: none;
    }

    .verbose-label input { width: auto; cursor: pointer; }

    /* Run header */
    #run-header {
      font-size: 12px;
      color: #888;
      line-height: 1.7;
      display: none;
    }

    /* Event rows */
    #event-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .event-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.5;
    }

    .event-row.pending  { color: #888; }
    .event-row.running  { color: #c8a830; }
    .event-row.pass     { color: #d4d4d4; }
    .event-row.fail     { color: #d4d4d4; }

    .event-row .status  { min-width: 1.2em; text-align: center; }
    .event-row .idx     { color: #555; min-width: 5.5em; flex-shrink: 0; }
    .event-row.pass .status { color: #4ec94e; }
    .event-row.fail .status { color: #e06060; }
    .event-row.pass .name   { color: #4ec94e; }
    .event-row.fail .name   { color: #e06060; }
    .event-row .detail  { color: #666; font-size: 12px; margin-left: auto; }

    /* Summary */
    #summary {
      font-size: 14px;
      font-weight: bold;
    }

    .pass-summary { color: #4ec94e; }
    .fail-summary { color: #e06060; }
    .error-msg    { color: #e06060; }

    .failures {
      margin-top: 10px;
      font-weight: normal;
      font-size: 13px;
      color: #d4d4d4;
    }

    .failures ul { list-style: none; margin-top: 6px; }
    .failures li { color: #e06060; padding: 2px 0; }
    .failures li::before { content: '  ✗ '; }

    /* Log area */
    #log-area {
      display: none;
      background: #111;
      border: 1px solid #333;
      border-radius: 3px;
      color: #666;
      font-size: 11px;
      line-height: 1.5;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
      white-space: pre;
      word-break: break-all;
    }
  </style>

  <!--
    mqtt.js browser build: the official prebuilt UMD bundle exposes a global
    `mqtt` (window.mqtt). We use this instead of an ESM transform
    (jsdelivr `+esm` / esm.sh) because mqtt@4 is a CJS package that depends on
    Node builtins (process/Buffer/stream); those transforms don't reliably
    polyfill them in the browser and fail at runtime ("X is undefined").
    Version matches the repo dependency ("mqtt": "~4.2.6" in package.json).
    Loaded as a classic script so window.mqtt is ready before the deferred
    <script type="module"> below runs.
    Fallback if unpkg is blocked: https://cdn.jsdelivr.net/npm/mqtt@4.2.6/dist/mqtt.min.js
    NOTE: Browsers can only use ws:// or wss:// MQTT connections — not mqtt:// tcp.
  -->
  <script src="https://unpkg.com/mqtt@4.2.6/dist/mqtt.min.js"></script>
</head>
<body>

<h1>═══ MQTT Broker Round-Trip Test ═══</h1>

<div class="section">
  <div class="section-title">Configuration</div>
  <form id="config-form">
    <div class="form-grid">

      <div class="form-field full-width">
        <label for="broker-url">Broker URL (default: wss://realtime-jogja.qiscus.com:1886/mqtt)</label>
        <input type="text" id="broker-url" name="broker-url"
               value="wss://realtime-jogja.qiscus.com:1886/mqtt" required>
      </div>

      <div class="form-field">
        <label for="username">Username (empty = anonymous)</label>
        <input type="text" id="username" name="username" autocomplete="off">
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="off">
      </div>

      <div class="form-field">
        <label for="app-id">App ID (default: sdksample)</label>
        <input type="text" id="app-id" name="app-id" value="sdksample" required>
      </div>

      <div class="form-field">
        <label for="user-id">User ID (default: guest-1001)</label>
        <input type="text" id="user-id" name="user-id" value="guest-1001" required>
      </div>

      <div class="form-field">
        <label for="partner-id">Partner ID (default: guest-1002)</label>
        <input type="text" id="partner-id" name="partner-id" value="guest-1002" required>
      </div>

      <div class="form-field">
        <label for="user-token">User Token (default: testtoken-&lt;random&gt;)</label>
        <input type="text" id="user-token" name="user-token" required>
      </div>

      <div class="form-field">
        <label for="room-id">Room ID (default: 12345)</label>
        <input type="text" id="room-id" name="room-id" value="12345" required>
      </div>

      <div class="form-field">
        <label for="channel-unique-id">Channel Unique ID (default: channel-001)</label>
        <input type="text" id="channel-unique-id" name="channel-unique-id" value="channel-001" required>
      </div>

      <div class="form-field">
        <label for="event-timeout">Event timeout ms (default: 5000)</label>
        <input type="number" id="event-timeout" name="event-timeout"
               value="5000" min="500" max="60000" required>
      </div>

      <p class="ws-note">
        ⚠ Browsers only support <code>ws://</code> or <code>wss://</code> URLs —
        <code>mqtt://</code> TCP is not available in browser context.
        Auth (username/password) is attached to connect options only when username is non-empty.
      </p>

    </div><!-- .form-grid -->

    <div class="actions">
      <button type="submit" id="run-btn">Run test</button>
      <button type="button" id="copy-btn" class="secondary" style="display:none">Copy results</button>
      <label class="verbose-label">
        <input type="checkbox" id="verbose-toggle"> Verbose log
      </label>
    </div>

  </form>
</div><!-- .section config -->

<div class="section" id="results-section" style="display:none">
  <div id="run-header"></div>
  <div style="margin: 12px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #555;">Events</div>
  <div id="event-list"></div>
  <div style="margin-top: 14px;" id="summary"></div>
</div>

<div class="section" id="log-section" style="display:none">
  <div class="section-title">Receive Log</div>
  <pre id="log-area"></pre>
</div>

<script type="module">
import { buildCatalog, EVENT_COUNT } from './mqtt-events.mjs'

// mqtt.js is loaded as a UMD global by the <script src=...mqtt.min.js> in <head>.
const mqtt = window.mqtt
if (mqtt == null) {
  document.body.insertAdjacentHTML('afterbegin',
    '<p style="color:#c00;padding:12px">Failed to load mqtt.js from CDN. ' +
    'Check your network / the unpkg URL in &lt;head&gt;.</p>')
  throw new Error('mqtt global not available — CDN script failed to load')
}

// ─── Pre-fill user token with random suffix (same default logic as Node script) ─
document.getElementById('user-token').value =
  `testtoken-${Math.random().toString(36).slice(2, 8)}`

// ─── Helpers (mirrored from mqtt-broker-test.mjs) ───────────────────────────

function makeClientId(role) {
  return `mqtttest-${role}-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`
}

function connectClient(url, clientId, username, password) {
  const opts = { clientId }
  if (username) {
    opts.username = username
    opts.password = password
  }
  return mqtt.connect(url, opts)
}

function waitForConnect(client) {
  return new Promise((resolve, reject) => {
    client.once('connect', resolve)
    client.once('error', reject)
  })
}

function waitForSuback(client, topics) {
  return new Promise((resolve, reject) => {
    client.subscribe(topics, (err) => {
      if (err) reject(err)
      else resolve()
    })
  })
}

function delay(ms) {
  return new Promise((res) => setTimeout(res, ms))
}

/**
 * Publish entry.publishTopic from pub; wait until sub receives a topic
 * matching entry.matchRegex, or timeoutMs elapses.
 * Calls onReceive(topic, payloadStr) for every message received while waiting.
 */
function runEvent(pub, sub, entry, timeoutMs, onReceive) {
  return new Promise((resolve) => {
    const startMs = Date.now()

    const timer = setTimeout(() => {
      sub.removeListener('message', handler)
      resolve({ ok: false, elapsed: timeoutMs, topic: entry.publishTopic })
    }, timeoutMs)

    function handler(topic, message) {
      const msgStr = message.toString().slice(0, 160)
      onReceive(topic, msgStr)
      if (entry.matchRegex.test(topic)) {
        clearTimeout(timer)
        sub.removeListener('message', handler)
        resolve({ ok: true, elapsed: Date.now() - startMs, topic })
      }
    }

    sub.on('message', handler)
    pub.publish(entry.publishTopic, entry.payload, { retain: entry.retain ?? false })
  })
}

// ─── DOM helpers ─────────────────────────────────────────────────────────────

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
}

function getFormConfig() {
  return {
    brokerUrl:       document.getElementById('broker-url').value.trim(),
    username:        document.getElementById('username').value.trim(),
    password:        document.getElementById('password').value,
    appId:           document.getElementById('app-id').value.trim(),
    userId:          document.getElementById('user-id').value.trim(),
    partnerId:       document.getElementById('partner-id').value.trim(),
    userToken:       document.getElementById('user-token').value.trim(),
    roomId:          document.getElementById('room-id').value.trim(),
    channelUniqueId: document.getElementById('channel-unique-id').value.trim(),
    eventTimeoutMs:  parseInt(document.getElementById('event-timeout').value, 10) || 5000,
  }
}

function initRows(catalog) {
  const list = document.getElementById('event-list')
  list.innerHTML = ''
  catalog.forEach((entry, i) => {
    const row = document.createElement('div')
    row.id = `row-${i}`
    row.className = 'event-row pending'
    row.innerHTML =
      `<span class="status">⏳</span>` +
      `<span class="idx">[${i + 1}/${catalog.length}]</span>` +
      `<span class="name">${esc(entry.name)}</span>` +
      `<span class="detail">${esc(entry.publishTopic)}</span>`
    list.appendChild(row)
  })
}

function updateRow(i, entry, result, catalogLen, timeoutMs) {
  const row = document.getElementById(`row-${i}`)
  if (!row) return
  if (result.ok) {
    row.className = 'event-row pass'
    row.innerHTML =
      `<span class="status">✓</span>` +
      `<span class="idx">[${i + 1}/${catalogLen}]</span>` +
      `<span class="name">${esc(entry.name)}</span>` +
      `<span class="detail">(${result.elapsed} ms) ${esc(entry.publishTopic)}</span>`
  } else {
    row.className = 'event-row fail'
    row.innerHTML =
      `<span class="status">✗</span>` +
      `<span class="idx">[${i + 1}/${catalogLen}]</span>` +
      `<span class="name">${esc(entry.name)}</span>` +
      `<span class="detail">(timeout ${timeoutMs} ms) ${esc(entry.publishTopic)}</span>`
  }
}

function showSummary(results, catalogLen, timeoutMs) {
  const passed = results.filter((r) => r.result.ok).length
  const summaryEl = document.getElementById('summary')
  if (passed === catalogLen) {
    summaryEl.innerHTML =
      `<div class="pass-summary">✓ ${passed}/${catalogLen} passed — all events round-tripped successfully.</div>`
  } else {
    const failures = results.filter((r) => !r.result.ok)
    summaryEl.innerHTML =
      `<div class="fail-summary">✗ ${passed}/${catalogLen} passed.</div>` +
      `<div class="failures"><strong>Failures:</strong><ul>` +
      failures.map((f) => `<li>${esc(f.entry.name)} — ${esc(f.entry.publishTopic)}</li>`).join('') +
      `</ul></div>`
  }
}

function showError(msg) {
  document.getElementById('summary').innerHTML =
    `<div class="error-msg">Error: ${esc(msg)}</div>`
}

// ─── Verbose log ─────────────────────────────────────────────────────────────

const verboseToggle = document.getElementById('verbose-toggle')
const logSection    = document.getElementById('log-section')
const logArea       = document.getElementById('log-area')

verboseToggle.addEventListener('change', () => {
  if (!verboseToggle.checked) {
    logSection.style.display = 'none'
  }
})

function appendLog(topic, msgStr) {
  if (!verboseToggle.checked) return
  logSection.style.display = ''
  logArea.textContent += `[recv] topic=${topic}  payload=${msgStr}\n`
  logArea.scrollTop = logArea.scrollHeight
}

// ─── Copy results ─────────────────────────────────────────────────────────────

let lastCopyData = null

document.getElementById('copy-btn').addEventListener('click', () => {
  if (!lastCopyData) return
  const { config, catalog, results, timeoutMs } = lastCopyData
  const passed = results.filter((r) => r.result.ok).length
  const lines = [
    'MQTT Broker Round-Trip Test',
    `Broker    : ${config.brokerUrl}`,
    `Auth      : ${config.username ? `on  (username=${config.username})` : 'off (anonymous)'}`,
    `Timeout   : ${timeoutMs} ms / event`,
    '',
    'Events:',
    ...results.map((r, i) => {
      const { entry, result } = r
      const idx = `[${i + 1}/${catalog.length}]`
      return result.ok
        ? `  ✓ ${idx} ${entry.name}  (${result.elapsed} ms) ${entry.publishTopic}`
        : `  ✗ ${idx} ${entry.name}  (timeout ${timeoutMs} ms) ${entry.publishTopic}`
    }),
    '',
    passed === catalog.length
      ? `✓ ${passed}/${catalog.length} passed — all events round-tripped successfully.`
      : `✗ ${passed}/${catalog.length} passed.`,
    '',
  ]
  const text = lines.join('\n')
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn')
    btn.textContent = 'Copied!'
    setTimeout(() => { btn.textContent = 'Copy results' }, 2000)
  }).catch(() => {
    // Fallback: create a textarea and copy
    const ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'
    ta.style.opacity = '0'
    document.body.appendChild(ta)
    ta.select()
    document.execCommand('copy')
    document.body.removeChild(ta)
    const btn = document.getElementById('copy-btn')
    btn.textContent = 'Copied!'
    setTimeout(() => { btn.textContent = 'Copy results' }, 2000)
  })
})

// ─── Main test runner ─────────────────────────────────────────────────────────

async function runTest(config) {
  const {
    brokerUrl, username, password,
    appId, userId, partnerId, userToken, roomId, channelUniqueId,
    eventTimeoutMs,
  } = config

  const catalog   = buildCatalog({ appId, userId, partnerId, userToken, roomId, channelUniqueId })
  const overallMs = eventTimeoutMs * EVENT_COUNT + 8000

  // Show results section and render header + pending rows
  document.getElementById('results-section').style.display = ''
  document.getElementById('run-header').innerHTML =
    `<strong>Broker:</strong> ${esc(brokerUrl)}<br>` +
    `<strong>Auth:</strong> ${username ? `on (username=${esc(username)})` : 'off (anonymous)'}<br>` +
    `<strong>Timeout:</strong> ${eventTimeoutMs} ms / event`
  document.getElementById('summary').innerHTML = ''
  logArea.textContent = ''
  initRows(catalog)

  // Reset copy state
  lastCopyData = null
  document.getElementById('copy-btn').style.display = 'none'
  document.getElementById('copy-btn').textContent = 'Copy results'

  const results = []
  let sub = null, pub = null
  let safetyTimer = null

  const safetyPromise = new Promise((_, reject) => {
    safetyTimer = setTimeout(
      () => reject(new Error(`Overall safety timeout (${overallMs} ms) — connection may have hung`)),
      overallMs
    )
  })

  try {
    await Promise.race([
      (async () => {
        const subId = makeClientId('sub')
        const pubId = makeClientId('pub')

        // Step 1: connect subscriber
        sub = connectClient(brokerUrl, subId, username, password)
        await waitForConnect(sub)

        // Step 2: subscribe to all unique SDK topic patterns
        const subTopics = [...new Set(catalog.map((e) => e.subscribeTopic))]
        await waitForSuback(sub, subTopics)

        // Step 3: drain any retained messages (300 ms — same as Node script)
        await delay(300)

        // Step 4: connect publisher
        pub = connectClient(brokerUrl, pubId, username, password)
        await waitForConnect(pub)

        // Step 5: run events sequentially, updating DOM in place
        for (let i = 0; i < catalog.length; i++) {
          const entry = catalog[i]
          const result = await runEvent(pub, sub, entry, eventTimeoutMs, appendLog)
          results.push({ entry, result })
          updateRow(i, entry, result, catalog.length, eventTimeoutMs)
        }
      })(),
      safetyPromise,
    ])
  } catch (err) {
    showError(err.message)
    return
  } finally {
    clearTimeout(safetyTimer)
    // Force-close both clients so no reconnect loops remain
    if (pub) await new Promise((res) => pub.end(true, {}, res))
    if (sub) await new Promise((res) => sub.end(true, {}, res))
  }

  // Summary
  showSummary(results, catalog.length, eventTimeoutMs)

  // Enable copy button
  lastCopyData = { config, catalog, results, timeoutMs: eventTimeoutMs }
  document.getElementById('copy-btn').style.display = ''
}

// ─── Form submit handler ──────────────────────────────────────────────────────

const form   = document.getElementById('config-form')
const runBtn = document.getElementById('run-btn')

form.addEventListener('submit', async (e) => {
  e.preventDefault()

  const config = getFormConfig()

  // Browser safety: validate ws/wss scheme
  if (!config.brokerUrl.startsWith('ws://') && !config.brokerUrl.startsWith('wss://')) {
    document.getElementById('results-section').style.display = ''
    document.getElementById('run-header').innerHTML = ''
    document.getElementById('event-list').innerHTML = ''
    document.getElementById('summary').innerHTML =
      `<div class="error-msg">⚠ Broker URL must use <code>ws://</code> or <code>wss://</code> ` +
      `in a browser — got: <code>${esc(config.brokerUrl)}</code></div>`
    return
  }

  runBtn.disabled = true
  runBtn.textContent = 'Running…'

  try {
    await runTest(config)
  } catch (err) {
    document.getElementById('results-section').style.display = ''
    document.getElementById('summary').innerHTML =
      `<div class="error-msg">Fatal: ${esc(err.message)}</div>`
  } finally {
    runBtn.disabled = false
    runBtn.textContent = 'Run test'
  }
})
</script>

</body>
</html>
