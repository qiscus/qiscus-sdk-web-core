# pnpm >=10 blocks dependency build scripts until explicitly allowed.
# esbuild (used by Vite) needs its install step; fsevents is the macOS
# file-watching native addon (used by `vite --watch`); core-js@2 only prints
# a postinstall ad, so it stays disabled.
allowBuilds:
  esbuild: true
  fsevents: true
  core-js: false
